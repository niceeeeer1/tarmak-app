<title>Тармақ колледж желісі</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: single 620px column like a mobile app, sticky top bar + tabs, fixed 5-button bottom nav, sheets slide up */
:root{
  --bg:#ffffff; --fg:#0f1012; --muted:#86888f; --line:#e5e5e8; --surface:#f2f2f4; --elev:#ffffff;
  --link:#1f6ad1; --verified:#1d9bf0; --official:#0f9f74; --like:#ff3040;
  --ok:#147a48; --ok-bg:#e2f4ea; --warn:#9a5b00; --warn-bg:#fcefd6; --info:#1f5bbd; --info-bg:#e3ecfa;
  --bad:#cf2119; --bad-bg:#fde5e3; --neutral:#5b5d66; --neutral-bg:#ececef;
  --scrim:rgba(10,10,12,.38); --shadow:0 10px 30px rgba(0,0,0,.12);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101010; --fg:#f3f5f7; --muted:#8b8c92; --line:#272729; --surface:#1d1d1f; --elev:#1a1a1b;
  --link:#62a6ff; --verified:#38a9f5; --official:#2fc993; --like:#ff4a5c;
  --ok:#4fd48e; --ok-bg:#13301f; --warn:#f2b552; --warn-bg:#352610; --info:#82acff; --info-bg:#16243f;
  --bad:#ff6b60; --bad-bg:#3b1614; --neutral:#a7a8ae; --neutral-bg:#2a2a2d;
  --scrim:rgba(0,0,0,.62); --shadow:0 10px 30px rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101010; --fg:#f3f5f7; --muted:#8b8c92; --line:#272729; --surface:#1d1d1f; --elev:#1a1a1b;
  --link:#62a6ff; --verified:#38a9f5; --official:#2fc993; --like:#ff4a5c;
  --ok:#4fd48e; --ok-bg:#13301f; --warn:#f2b552; --warn-bg:#352610; --info:#82acff; --info-bg:#16243f;
  --bad:#ff6b60; --bad-bg:#3b1614; --neutral:#a7a8ae; --neutral-bg:#2a2a2d;
  --scrim:rgba(0,0,0,.62); --shadow:0 10px 30px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:15px;line-height:1.42;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:8px}
.app{max-width:620px;margin:0 auto;min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
@media(min-width:660px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px)}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:54px}
.bar .l{display:flex;gap:2px;justify-self:start}.bar .r{justify-self:end;display:flex;gap:6px;align-items:center}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--fg)}
.ib:hover{background:var(--surface)}
.title{font-weight:700;font-size:16px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;font-size:11.5px;font-weight:700;letter-spacing:.04em}
.lang button{padding:5px 9px;border-radius:999px;color:var(--muted)}
.lang button.on{background:var(--fg);color:var(--bg)}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:0 -4px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:11px 12px 10px;font-weight:600;color:var(--muted);border-bottom:1.5px solid transparent;white-space:nowrap;font-size:14.5px;transition:color .2s}
.tabs button.on{color:var(--fg);border-color:var(--fg)}
.item{border-bottom:1px solid var(--line);padding:4px 0 6px}
.rph{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:600;padding:8px 0 0 24px}
.post{display:flex;gap:12px;padding:10px 0 4px;cursor:pointer}
.post.static{cursor:default}
.rail{width:36px;flex:none;display:flex;flex-direction:column;align-items:center}
.rail .line{flex:1;width:2px;background:var(--line);border-radius:2px;margin:6px 0 -8px;min-height:18px}
.main{flex:1;min-width:0}
.ph{display:flex;align-items:center;gap:5px;min-height:22px}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
.name.link{cursor:pointer}
.time{color:var(--muted);white-space:nowrap}
.more{margin-left:auto;color:var(--muted);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.more:hover{background:var(--surface);color:var(--fg)}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:1px}
.tag{color:var(--link);cursor:pointer;text-decoration:none}
.tag:hover{text-decoration:underline}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;position:relative;flex:none;cursor:pointer;letter-spacing:.01em}
.av.anon{background:var(--neutral-bg);color:var(--neutral);cursor:default}
.av .plus{position:absolute;right:-4px;bottom:-4px;width:19px;height:19px;border-radius:50%;background:var(--fg);color:var(--bg);border:2px solid var(--bg);display:grid;place-items:center;transition:transform .2s}
.av .plus:active{transform:scale(.8)}
.acts{display:flex;align-items:center;gap:2px;margin:6px 0 0 -8px;flex-wrap:wrap}
.act{display:flex;align-items:center;gap:5px;padding:6px 9px;border-radius:999px;color:var(--fg);font-size:13.5px;font-variant-numeric:tabular-nums;transition:background .15s,color .15s}
.act:hover{background:var(--surface)}
.act.liked{color:var(--like)}
.act.reposted{color:var(--ok)}
.act.conf{border:1px solid var(--line);margin-left:4px;font-weight:600;font-size:12.5px;padding:5px 10px}
.act.conf.on{background:var(--info-bg);color:var(--info);border-color:transparent}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.38)}60%{transform:scale(.9)}100%{transform:scale(1)}}
.pop svg{animation:pop .45s cubic-bezier(.2,.8,.3,1.2)}
@keyframes spin{from{transform:rotate(-180deg)}to{transform:none}}
.spin svg{animation:spin .45s cubic-bezier(.2,.8,.2,1)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0 3px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--neutral-bg);color:var(--neutral);line-height:1.35;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.info{background:var(--info-bg);color:var(--info)}.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.num{font-variant-numeric:tabular-nums;background:transparent;border:1px solid var(--line);color:var(--fg)}
.chip.solid-bad{background:var(--bad);color:var(--bg)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.chip.solid-bad{animation:pulse 2.2s ease-in-out infinite}
.meta{display:flex;flex-wrap:wrap;gap:3px 12px;color:var(--muted);font-size:13px;margin:1px 0 4px}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta .late{color:var(--bad);font-weight:600}
.photos{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:8px -16px 2px 0;padding-right:16px;scrollbar-width:none}
.photos::-webkit-scrollbar{display:none}
.photo{flex:none;height:230px;aspect-ratio:4/5;max-width:100%;border-radius:10px;scroll-snap-align:start;position:relative;overflow:hidden;border:1px solid var(--line);display:grid;place-items:center}
.photos.one .photo{height:auto;width:min(100%,420px);aspect-ratio:4/3}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .em{font-size:68px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))}
.photo .cap{position:absolute;left:10px;bottom:9px;right:10px;color:#fff;font-size:12px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.photo .x{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.poll{display:flex;flex-direction:column;gap:6px;margin:8px 0 2px}
.opt{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:12px;min-height:42px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;font-weight:500;width:100%}
.opt .fill{position:absolute;inset:0 auto 0 0;background:var(--surface);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.opt.mine .fill{background:color-mix(in srgb,var(--fg) 13%,transparent)}
.opt .lb,.opt .pc{position:relative;display:flex;align-items:center;gap:6px}
.opt .pc{font-variant-numeric:tabular-nums;font-weight:600}
.opt.mine{border-color:var(--fg)}
.pm{color:var(--muted);font-size:13px}
.quote{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0 2px;cursor:pointer}
.quote .qh{display:flex;align-items:center;gap:6px;font-size:14px}
.quote .qt{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;margin-top:4px;white-space:pre-wrap}
.official{border:1px solid color-mix(in srgb,var(--official) 40%,var(--line));background:color-mix(in srgb,var(--official) 7%,var(--bg));border-radius:12px;padding:10px 12px;margin:8px 0 2px}
.official .oh{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--official);flex-wrap:wrap}
.official .ot{margin-top:3px;font-size:14px;white-space:pre-wrap}
.official .ot.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mine-anon{font-size:11.5px;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:1px 7px;white-space:nowrap}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav .in{max-width:620px;margin:0 auto;display:flex;justify-content:space-around;height:62px;align-items:center}
.nav button{width:60px;height:48px;display:grid;place-items:center;color:var(--muted);border-radius:12px;position:relative;transition:color .15s,transform .15s}
.nav button:active{transform:scale(.9)}
.nav button.on{color:var(--fg)}
.nav .plusb{background:var(--surface);width:60px;height:44px;border-radius:12px}
.nav .plusb:hover{color:var(--fg)}
.dot{position:absolute;top:9px;right:17px;width:8px;height:8px;border-radius:50%;background:var(--like);border:2px solid var(--bg)}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;margin:0 auto;max-width:620px;background:var(--elev);border-radius:22px 22px 0 0;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .3s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:6px auto 14px}
.menu{background:var(--surface);border-radius:16px;overflow:hidden;margin-bottom:10px}
.menu>button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 16px;font-weight:600;border-bottom:1px solid var(--line);text-align:left}
.menu>button:last-child{border-bottom:0}
.menu>button:hover{background:color-mix(in srgb,var(--fg) 5%,transparent)}
.menu .danger{color:var(--bad)}
.sh-title{font-weight:700;font-size:15px;margin:0 2px 10px}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 2px 7px}
.seg{display:flex;background:var(--surface);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);transition:all .2s}
.seg button.on{background:var(--elev);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:10px;font-weight:600;border:1px solid var(--line);white-space:nowrap;font-size:14px}
.btn.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.sm{height:30px;padding:0 11px;font-size:13px;border-radius:9px}
.btn.wide{flex:1}
.btn:disabled{opacity:.35;cursor:default}
.toastw{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:70;pointer-events:none;padding:0 16px}
.toast{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;animation:up2 .25s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow);max-width:100%;overflow-wrap:anywhere}
.view{animation:slidein .26s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateX(26px);opacity:.3}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes up2{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.livepill{position:sticky;top:calc(env(safe-area-inset-top,0px) + 108px);z-index:15;display:flex;justify-content:center;height:0}
.livepill button{background:var(--fg);color:var(--bg);font-weight:600;font-size:13px;padding:8px 14px;border-radius:999px;box-shadow:var(--shadow);transform:translateY(8px);animation:up2 .3s;display:flex;gap:6px;align-items:center}
/* composer */
.comp{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column;animation:up .32s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px)}
.comp .cw{max-width:620px;width:100%;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.comp .body{flex:1;overflow:auto}
.chead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:54px;border-bottom:1px solid var(--line)}
.chead .cx{justify-self:start;font-size:15.5px}
.types{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.types::-webkit-scrollbar{display:none}
.tp{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13.5px;color:var(--muted);transition:all .2s}
.tp.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tbox{border:1px solid var(--line);border-radius:14px;padding:4px 12px 12px;margin:8px 0 4px}
.tbox .lbl{margin-top:10px}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500}
.cat.on{border-color:var(--fg);background:var(--surface);font-weight:600}
.locrow{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:6px}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font-size:14px;min-width:0}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;gap:6px;align-items:center}
.seg-row{display:flex;gap:12px;padding:12px 0 0}
.ta{width:100%;border:0;background:transparent;resize:none;outline:none;font-size:15px;line-height:1.42;padding:2px 0;min-height:24px;display:block}
.ta::placeholder{color:var(--muted)}
.tools{display:flex;gap:2px;margin:6px 0 4px -8px;color:var(--muted)}
.tools button{display:flex;align-items:center;gap:5px;padding:6px 8px;border-radius:999px;font-size:12.5px;font-weight:600}
.tools button:hover{background:var(--surface);color:var(--fg)}
.pedit{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.pedit .r{display:flex;gap:6px;align-items:center}
.addt{display:flex;gap:12px;align-items:center;padding:10px 0 16px;color:var(--muted);font-weight:500;width:100%}
.addt .av{opacity:.5}
.cfoot{border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.cfoot .cw{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sw{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;color:var(--muted);text-align:left}
.sw .k{width:42px;height:25px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw .k::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.sw.on{color:var(--fg)}.sw.on .k{background:var(--fg)}.sw.on .k::after{transform:translateX(17px)}
.anonhint{font-size:12.5px;color:var(--muted);background:var(--surface);border-radius:12px;padding:10px 12px;margin:4px 0 12px;display:flex;gap:8px}
/* detail */
.dsec{display:flex;align-items:center;justify-content:space-between;font-weight:700;padding:14px 0 6px;border-bottom:1px solid var(--line)}
.nest{padding-left:48px}
.replybar{position:fixed;left:0;right:0;bottom:calc(63px + env(safe-area-inset-bottom,0px));z-index:22;background:var(--bg);border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.replybar .in{max-width:588px;margin:0 auto;padding:8px 0}
.replybar .rt{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.replybar .box{display:flex;gap:10px;align-items:center}
.replybar input{flex:1;background:var(--surface);border:0;border-radius:999px;padding:10px 14px;min-width:0;outline:none}
.sendb{width:38px;height:38px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;flex:none}
.sendb:disabled{opacity:.3}
.adm{border:1px solid var(--line);border-radius:14px;padding:4px 12px 12px;margin:10px 0}
.adm .ah{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13.5px;padding-top:8px}
.stb{display:flex;flex-wrap:wrap;gap:6px}
.stb button{border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted);transition:all .2s}
.stb button.on.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.stb button.on.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.stb button.on.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.stb button.on.bad,.stb button.on.neutral{background:var(--neutral-bg);color:var(--fg);border-color:transparent}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row input[type=date]{width:auto;padding:5px 8px}
textarea.inp{resize:vertical;min-height:64px;line-height:1.4}
/* profile */
.prof{padding:14px 0 6px}
.prof .pt{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.prof h1{font-size:23px;margin:0;line-height:1.2;text-wrap:balance}
.prof .hd{display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap}
.pill{font-size:11.5px;color:var(--muted);background:var(--surface);border-radius:999px;padding:3px 8px}
.prof .bio{margin:10px 0 4px}
.prof .fl{color:var(--muted);font-size:14px;margin:8px 0 14px}
.prof .bt{display:flex;gap:8px}
.democard{border:1px dashed var(--line);border-radius:14px;padding:10px 12px 12px;margin:14px 0 4px}
.democard .dh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.empty{color:var(--muted);text-align:center;padding:40px 16px}
/* search & notif */
.sbox{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;padding:0 12px;height:42px;margin:6px 0 8px}
.sbox input{flex:1;border:0;background:transparent;outline:none;min-width:0;font-size:15px}
.sh{font-weight:700;font-size:15px;margin:14px 0 4px}
.urow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.urow .ui{flex:1;min-width:0}
.urow .un{font-weight:600;display:flex;gap:4px;align-items:center}
.urow .us{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.trow b{font-weight:600}.trow span{color:var(--muted);font-size:13.5px}
.nrow{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.nrow .nb{position:absolute;right:-4px;bottom:-4px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;color:#fff;border:2px solid var(--bg)}
.nrow .ntx{flex:1;min-width:0;font-size:14.5px}
.nrow .ns{color:var(--muted);font-size:13.5px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nrow.unread{background:linear-gradient(90deg,color-mix(in srgb,var(--link) 7%,transparent),transparent 60%)}
.fchips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 6px;scrollbar-width:none}
.fchips button{flex:none;border:1px solid var(--line);border-radius:10px;padding:6px 14px;font-weight:600;font-size:13.5px}
.fchips button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
.kpi{border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi .v{font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.15}
.kpi .v small{font-size:14px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .k{color:var(--muted);font-size:12.5px;font-weight:500}
.kpi.alert .v{color:var(--bad)}
.kpi .spark{height:4px;border-radius:4px;background:var(--surface);margin-top:9px;overflow:hidden}
.kpi .spark i{display:block;height:100%;background:var(--ok);border-radius:4px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.panel{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.panel h3{margin:0 0 10px;font-size:14px}
.formula{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums;font-size:15px}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.15}
.frac span:first-child{border-bottom:1.5px solid var(--fg);padding:0 4px 1px}
.frac span:last-child{padding-top:1px}
.formula b{font-size:18px}
.fnote{color:var(--muted);font-size:12.5px;margin-top:8px}
.brow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) auto;gap:10px;align-items:center;padding:5px 0;font-size:13.5px}
.brow .bt{height:10px;border-radius:999px;background:var(--surface);overflow:hidden;position:relative}
.brow .bt i{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--fg) 28%,transparent);border-radius:999px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.brow .bt i.s{background:var(--ok)}
.brow .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;min-width:38px;text-align:right}
.brow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stack{display:flex;height:12px;border-radius:999px;overflow:hidden;gap:2px}
.stack i{display:block;height:100%;transition:flex .8s}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.tk{border-bottom:1px solid var(--line);padding:10px 0}
.tk .th{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tk .tt{font-size:14px;margin:4px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- small components ---------- */
function Avatar({uid:id,anon,size=36,plus}){
 const {go,act}=useApp();
 if(anon||!id) return <div className="av anon" style={{width:size,height:size}}><Icon n="eyeoff" s={size*.48}/></div>;
 const u=USERS[id]; const ini=u.name.split(' ').map(w=>w[0]).slice(0,2).join('');
 return <div className="av" role="link" tabIndex={0} aria-label={u.name} onClick={e=>{e.stopPropagation();go.profile(id)}}
  style={{width:size,height:size,fontSize:size*.36,background:`linear-gradient(140deg,hsl(${u.hue} 72% 62%),hsl(${(u.hue+38)%360} 66% 44%))`}}>
  {u.role==='admin'?<Icon n="logo" s={size*.55} sw={2.4}/>:ini}
  {plus&&<button className="plus" aria-label="follow" onClick={e=>{e.stopPropagation();act.follow(id)}}><Icon n="plus" s={11} sw={3.2}/></button>}
 </div>;

function useAgo(){const {t,lang,now}=useApp();return ts=>{const s=(now-ts)/1000;if(s<60)return t('justNow');const m=s/60;if(m<60)return Math.floor(m)+' '+t('min');const h=m/60;if(h<24)return Math.floor(h)+' '+t('h');const d=h/24;if(d<7)return Math.floor(d)+' '+t('d');return fmtDate(ts,lang)}}
function RichText({text}){
 const {go}=useApp();
 const parts=(text||'').split(/(#[\p{L}\p{N}_]+|@[A-Za-z0-9_]+(?:\.[A-Za-z0-9_]+)*)/u);
 return <>{parts.map((p,i)=>i%2===1?<a key={i} className="tag" role="link" tabIndex={0} onClick={e=>{e.stopPropagation();p[0]==='#'?go.search(p):go.handle(p.slice(1))}}>{p}</a>:p)}</>;
}
function Photos({images,onRemove}){
 if(!images||!images.length) return null;
 return <div className={'photos'+(images.length===1?' one':'')} onClick={e=>e.stopPropagation()}>
  {images.map((im,i)=><div key={i} className="photo" style={im.kind==='scene'?{background:`linear-gradient(150deg,${im.g[0]},${im.g[1]})`}:null}>
   {im.kind==='img'?<img src={im.src} alt=""/>:<><span className="em">{im.e}</span><span className="cap">{im.c}</span></>}
   {onRemove&&<button className="x" aria-label="remove" onClick={()=>onRemove(i)}><Icon n="x" s={14} sw={2.6}/></button>}
  </div>)}
 </div>;

function Poll({post}){
 const {me,act,t}=useApp(); const by=post.poll.by||{}; const mine=by[me.id];
 const counts=post.poll.options.map((o,i)=>o.base+Object.values(by).filter(v=>v===i).length);
 const total=counts.reduce((a,b)=>a+b,0); const voted=mine!==undefined; const max=Math.max(...counts);
 return <div className="poll" onClick={e=>e.stopPropagation()}>
  {post.poll.options.map((o,i)=>{const pct=total?Math.round(counts[i]/total*100):0;
   return <button key={i} className={'opt'+(mine===i?' mine':'')} onClick={()=>act.vote(post.id,i)} aria-pressed={mine===i}>
    <span className="fill" style={{width:voted?pct+'%':'0%'}}/>
    <span className="lb" style={{fontWeight:voted&&counts[i]===max?700:500}}>{o.text}{mine===i&&<Icon n="check" s={16} sw={2.6}/>}</span>
    {voted&&<span className="pc">{pct}%</span>}
   </button>})}
  <div className="pm">{total} {t('votes')}</div>
 </div>;
}

function Actions({post}){

 const nLikes=post.likes+post.likedBy.length, nRep=post.reposts+post.repostedBy.length;
 const nReplies=post.replyBase+posts.filter(p=>p.parentId===post.id).length;

   <Icon n="heart" s={20} fill={liked?'currentColor':'none'}/>{nLikes>0&&<span>{nLikes}</span>}</button>
  <button className="act" aria-label="reply" onClick={stop(()=>go.post(post.id,{focus:true}))}><Icon n="msg" s={20}/>{nReplies>0&&<span>{nReplies}</span>}</button>

function PostDetail({id,focus}){

 if(!p0) return <div><SubBar title={t('thread')}/><div className="empty">—</div></div>;

 const roots=posts.filter(p=>ids.includes(p.parentId)).sort((a,b)=>a.createdAt-b.createdAt);

  <div className="dsec"><span>{t('repliesH')}</span><span className="pm">{roots.length+head.replyBase}</span></div>
  {roots.map(r=><div key={r.id} style={{borderBottom:'1px solid var(--line)'}}><Tree r={r}/></div>)}
  {!roots.length&&<div className="empty">{t('noReplies')}</div>}

function Search(){

  const num=/^#?\d{1,4}$/.test(q)?parseInt(q.replace('#',''),10):null;
  const tickets=num!=null?top.filter(p=>p.ticket&&p.ticket.num===num):[];
  const rooms=num!=null||/^\d{2,4}$/.test(q)?top.filter(p=>p.ticket&&(p.ticket.loc.r||'').toLowerCase().includes(q.replace('#','').toLowerCase())&&!tickets.includes(p)):[];
  const people=Object.values(USERS).filter(u=>u.name.toLowerCase().includes(ql)||u.handle.toLowerCase().includes(ql));
  const ps=top.filter(p=>!tickets.includes(p)&&!rooms.includes(p)&&p.text.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.createdAt-a.createdAt);

 },[q,posts]);

  {!res&&<><div className="sh">{t('trending')}</div>{tags.map(([h,n])=><button key={h} className="trow" onClick={()=>setQuery(h)}><b>{h}</b><span>{n} {t('postsN')}</span></button>)}
   <div className="sh">{t('suggested')}</div>{Object.values(USERS).filter(u=>u.id!==me.id).slice(0,5).map(u=><URow key={u.id} u={u}/>)}</>}

 const rootOf=id=>{let p=posts.find(x=>x.id===id);while(p&&p.parentId){const q=posts.find(x=>x.id===p.parentId);if(!q)break;p=q}return p?(p.chainOf||p.id):id};
 const go={
  tab:k=>{scrollMem.current[vkey]=window.scrollY;setStack([]);setTab(k);if(k==='home'&&tab==='home'&&!stack.length)window.scrollTo({top:0,behavior:'smooth'})},
  push:v=>{scrollMem.current[vkey]=window.scrollY;setStack(s=>[...s,v])},
  back:()=>setStack(s=>s.slice(0,-1)),
  post:(id,o={})=>go.push({name:'post',id:rootOf(id),focus:!!o.focus}),
  profile:id=>go.push({name:'profile',uid:id}),
  handle:h=>{const u=Object.values(USERS).find(u=>u.handle.toLowerCase()===h.toLowerCase());u?go.profile(u.id):go.search('@'+h)},
  search:q=>{setQuery(q);setStack([]);setTab('search')},
  admin:()=>go.push({name:'admin'}),
 };
 const upd=(id,fn)=>setPosts(ps=>ps.map(p=>p.id===id?fn(p):p));
 const updT=(id,fn)=>upd(id,p=>({...p,ticket:fn(p.ticket)}));
 const notify=n=>setNotifs(ns=>[{id:uid(),at:Date.now(),read:false,...n},...ns]);
 const get=id=>posts.find(p=>p.id===id);
 const act={
  toast:showToast,
  setLang:l=>setLang(l),
  copy:(s,msg)=>{copyText(s).then(ok=>showToast(ok?msg:I18N[lang].copyFail+': '+s))},
  like:id=>{const p=get(id);upd(id,p=>({...p,likedBy:tog(p.likedBy,me.id)}));if(p&&!p.likedBy.includes(me.id)&&p.authorId!==me.id)notify({to:p.authorId,type:'like',from:me.id,postId:id})},
  vote:(id,i)=>upd(id,p=>{const by={...p.poll.by};if(by[me.id]===i)delete by[me.id];else by[me.id]=i;return {...p,poll:{...p.poll,by}}}),
  confirm:id=>{const p=get(id);updT(id,tk=>({...tk,confirmedBy:tog(tk.confirmedBy,me.id)}));if(p&&!p.ticket.confirmedBy.includes(me.id)&&p.authorId!==me.id)notify({to:p.authorId,type:'confirm',from:me.id,postId:id})},
  follow:id=>{const was=following.includes(id);setFollowing(f=>tog(f,id));showToast(was?t('unfollowed'):t('followed')+': '+USERS[id].name)},
  repost:id=>{const p=get(id);const mine=posts.find(x=>x.kind==='repost'&&x.repostOf===id&&x.authorId===me.id);
   if(p.repostedBy.includes(me.id)){setPosts(ps=>ps.filter(x=>!(x.kind==='repost'&&x.repostOf===id&&x.authorId===me.id)).map(x=>x.id===id?{...x,repostedBy:x.repostedBy.filter(v=>v!==me.id)}:x));showToast(t('repostRemoved'))}
   else{setPosts(ps=>[{id:uid(),kind:'repost',authorId:me.id,repostOf:id,createdAt:Date.now(),likedBy:[],repostedBy:[],text:''},...ps.map(x=>x.id===id?{...x,repostedBy:[...x.repostedBy,me.id]}:x)]);if(p.authorId!==me.id)notify({to:p.authorId,type:'repost',from:me.id,postId:id});showToast(t('repostDone'))}},
  publish:d=>{const ts=Date.now();const headId=uid();const isT=d.type!=='talk';
   const segs=d.segs.filter(s=>s.text.trim()||s.images.length||s.poll);
   const made=segs.map((s,i)=>mkPost({id:i===0?headId:uid(),type:d.type,authorId:me.id,anon:d.anon,text:s.text.trim(),images:s.images,
    poll:s.poll?{options:s.poll.options.filter(o=>o.trim()).map(o=>({text:o.trim(),base:0})),by:{}}:null,
    quoteId:i===0?d.quoteId:null,chainOf:i===0?null:headId,chainIdx:i,createdAt:ts+i,
    ticket:i===0&&isT?mkTicket({num:nextNum,cat:d.type==='complaint'?d.cat:d.type,loc:{...d.loc},status:d.type==='lost'?'searching':'accepted'}):null}));
   setPosts(ps=>[...made,...ps]);
   if(isT){setNextNum(n=>n+1);notify({to:'a1',type:'ticket',from:d.anon?null:me.id,anon:d.anon,postId:headId})}
   if(d.quoteId){const q=get(d.quoteId);if(q&&q.authorId!==me.id)notify({to:q.authorId,type:'quote',from:me.id,postId:headId})}
   setComposer(null);setStack([]);setTab('home');setFeedTab('all');setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),30);
   showToast(isT?t('published')+' · '+pad(nextNum):t('published'));
   const author=me.id;const liker=['u2','u3','u4','t2'].find(x=>x!==author);
   setTimeout(()=>{setPosts(ps=>ps.map(p=>p.id===headId?{...p,likes:p.likes+1}:p));notify({to:author,type:'like',from:liker,postId:headId})},4000)},
  reply:(pid,text)=>{const p=get(pid);setPosts(ps=>[...ps,mkPost({id:uid(),type:'reply',parentId:pid,authorId:me.id,text,createdAt:Date.now()})]);if(p&&p.authorId!==me.id)notify({to:p.authorId,type:'reply',from:me.id,postId:pid});showToast(t('published'))},
  setStatus:(id,s)=>{const p=get(id);updT(id,tk=>({...tk,status:s,resolvedAt:SOLVED.includes(s)?(tk.resolvedAt&&SOLVED.includes(tk.status)?tk.resolvedAt:Date.now()):null}));notify({to:p.authorId,type:'status',postId:id,status:s});showToast(t('statusChanged')+': '+t('st_'+s))},
  setDeadline:(id,ts)=>{updT(id,tk=>({...tk,deadline:ts}));showToast(t('deadlineSet')+': '+fmtDate(ts,lang))},
  setOfficial:(id,text)=>{const p=get(id);updT(id,tk=>({...tk,official:{by:me.id,at:Date.now(),text}}));notify({to:p.authorId,type:'official',from:me.id,postId:id});showToast(t('published'))},
  del:id=>{setPosts(ps=>ps.filter(p=>p.id!==id&&p.chainOf!==id&&p.repostOf!==id&&p.parentId!==id));if(view.name==='post'&&view.id===id)go.back();showToast(t('deleted'))},
  reset:()=>{const s=seed(Date.now());setPosts(s.posts);setNextNum(s.nextNum);setNotifs(s.notifs);setFollowing(s.following);setStack([]);setTab('home');setPending(null);showToast(t('resetDone'))},
 };
 const setRole=r=>{setRoleS(r);showToast(I18N[lang].roleSet+' '+I18N[lang]['r_'+r])};
 const markRead=()=>setNotifs(ns=>ns.map(n=>n.to===me.id?{...n,read:true}:n));
 const acceptPending=()=>{setPosts(ps=>[pending,...ps]);setPending(null);window.scrollTo({top:0,behavior:'smooth'})};
 const unread=notifs.some(n=>n.to===me.id&&!n.read);
 const ctx={posts,t,lang,me,role,now,following,notifs,nextNum,go,act,setSheet,sheet,setComposer,feedTab,setFeedTab,query,setQuery,pending,acceptPending,setLang,themePref,setThemePref,setRole,stack,markRead};

 let body;
 if(view.name==='post') body=<PostDetail key={vkey} id={view.id} focus={view.focus}/>;
 else if(view.name==='profile') body=<Profile key={vkey} uid={view.uid}/>;
 else if(view.name==='admin') body=<Admin key={vkey}/>;
 else if(view.name==='search') body=<Search/>;
 else if(view.name==='notif') body=<Notifs key={role}/>;
 else if(view.name==='me') body=<Profile key={'me'+role} uid={me.id}/>;
 else body=<Feed/>;
 const NB=({k,ic,label})=><button className={!stack.length&&tab===k?'on':''} aria-label={label} onClick={()=>go.tab(k)}><Icon n={ic} s={26} sw={!stack.length&&tab===k?2.4:1.9} fill={k==='notif'&&!stack.length&&tab===k?'currentColor':'none'}/>{k==='notif'&&unread&&<span className="dot"/>}</button>;
 return <Ctx.Provider value={ctx}>
  <div className="app">{body}</div>
  <nav className="nav"><div className="in">
   <NB k="home" ic="home" label="Home"/><NB k="search" ic="search" label={t('search')}/>
   <button className="plusb" aria-label={t('newThread')} onClick={()=>setComposer({})}><Icon n="plus" s={24} sw={2.2}/></button>
   <NB k="notif" ic="heart" label={t('activity')}/><NB k="me" ic="user" label="Profile"/>
  </div></nav>
  {composer&&<Composer init={composer} onClose={()=>setComposer(null)}/>}
  <Sheets/>
  {toast&&<div className="toastw"><div className="toast" key={toast.k} role="status">{toast.s}</div></div>}
 </Ctx.Provider>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
